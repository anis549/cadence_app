<body>
<div id="root">
  <div id="fallback" style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:#8A8676;font-family:system-ui,sans-serif;font-size:14px;text-align:center;padding:20px;">
    Chargement de Cadence…
  </div>

<div id="boot-error" style="display:none;position:fixed;inset:0;background:#F7F6F1;color:#B0503A;font-family:monospace;font-size:12px;padding:20px;white-space:pre-wrap;overflow:auto;z-index:9999;"></div>

  window.addEventListener("error", function (e) {
    var el = document.getElementById("boot-error");
    if (el) {
      el.style.display = "block";
      el.textContent = "Erreur de chargement :\n\n" + (e.message || e) + "\n\n" + (e.filename ? (e.filename + ":" + e.lineno) : "");
    }
  });
</script>

<script type="text/babel" data-presets="react">

/* ============================================================
   CONFIG
   ============================================================ */
const API_URL = "https://script.google.com/macros/s/AKfycbxao2LUjkLV_O3JQ2Del1HFUrMBDSY896wtXWzctEcDJt2nZdmQqKMMM-VULMpRKd_p/exec";

/* ============================================================
   STORAGE LAYER — appels API vers le Google Sheet (Apps Script)
   ============================================================ */
const storage = {
  async get(key) {
    const res = await fetch(`${API_URL}?action=get&key=${encodeURIComponent(key)}`);
    const data = await res.json();
    if (!data.found) return null;
    return { key, value: data.value, shared: false };
  },
  async set(key, value) {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "set", key, value }),
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    return { key, value, shared: false };
  },
  async delete(key) {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "delete", key }),
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    return { key, deleted: true, shared: false };
  },
  async list(prefix = "") {
    const res = await fetch(`${API_URL}?action=list&prefix=${encodeURIComponent(prefix)}`);
    const data = await res.json();
    return { keys: data.keys || [], prefix, shared: false };
  },
};

const { useState, useEffect, useCallback, useRef, useMemo } = React;

/* ============================================================
   Hand-drawn inline icons (no external icon library dependency)
   ============================================================ */
function svgIcon(paths) {
  return function IconComp({ size = 16, color = "currentColor", style, strokeWidth = 2 }) {
    return (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color}
        strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" style={style}>
        {paths}
      </svg>
    );
  };
}

const Plus = svgIcon(<><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></>);
const Trash2 = svgIcon(<><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></>);
const Play = svgIcon(<polygon points="6 3 20 12 6 21 6 3"/>);
const Pause = svgIcon(<><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></>);
const RotateCcw = svgIcon(<><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></>);
const Check = svgIcon(<polyline points="20 6 9 17 4 12"/>);
const ChevronRight = svgIcon(<polyline points="9 18 15 12 9 6"/>);
const ChevronLeft = svgIcon(<polyline points="15 18 9 12 15 6"/>);
const ChevronDown = svgIcon(<polyline points="6 9 12 15 18 9"/>);
const Settings2 = svgIcon(<><path d="M4 21v-7"/><path d="M4 10V3"/><path d="M12 21v-9"/><path d="M12 8V3"/><path d="M20 21v-5"/><path d="M20 12V3"/><circle cx="4" cy="12" r="2"/><circle cx="12" cy="10" r="2"/><circle cx="20" cy="14" r="2"/></>);
const X = svgIcon(<><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></>);
const GripVertical = svgIcon(<><circle cx="9" cy="5" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="9" cy="19" r="1"/><circle cx="15" cy="5" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="15" cy="19" r="1"/></>);
const WifiOff = svgIcon(<><line x1="1" y1="1" x2="23" y2="23"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/><path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/><path d="M10.71 5.05A16 16 0 0 1 22.58 9"/><path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></>);
const RefreshCw = svgIcon(<><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></>);
const LayoutGrid = svgIcon(<><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></>);
const ListChecks = svgIcon(<><path d="M3 6l1.5 1.5L7.5 4.5"/><path d="M3 13l1.5 1.5L7.5 11.5"/><line x1="11" y1="6" x2="21" y2="6"/><line x1="11" y1="13" x2="21" y2="13"/><line x1="11" y1="20" x2="21" y2="20"/><path d="M3 20l1.5 1.5L7.5 18.5"/></>);
const TrendingUp = svgIcon(<><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></>);
const AlertTriangle = svgIcon(<><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></>);

function Icon({ icon: IconComp, size = 16, color = "currentColor", style, ...rest }) {
  return <IconComp size={size} color={color} style={style} {...rest} />;
}

/* ============================================================
   CONSTANTS & HELPERS
   ============================================================ */
const POMODORO_MIN = 25;

const DEFAULT_CATEGORIES = [
  { id: "cat_francais", name: "Apprendre le français", sub: "Préparation TCF",
    tasks: [{ name: "Écoute" }, { name: "Écrire" }, { name: "Lire" }, { name: "Parler" }] },
  { id: "cat_nexglab", name: "Nexglab", sub: "",
    tasks: [{ name: "Avancer sur les TP" }, { name: "Website officiel" }, { name: "Développement ailleurs" }] },
  { id: "cat_gc", name: "Formation Génie Civil", sub: "",
    tasks: [{ name: "Robot Structures (pont)" }, { name: "Etabs (bâtiments)" }] },
  { id: "cat_domaine", name: "Apprendre le domaine", sub: "",
    tasks: [{ name: "Recherche sur les domaines" }, { name: "Contacts" }] },
  { id: "cat_prog", name: "Formation programmation", sub: "",
    tasks: [{ name: "Python" }, { name: "JavaScript" }, { name: "SQL" }, { name: "IA" }] },
  { id: "cat_logiciel", name: "Formation logiciels importants", sub: "",
    tasks: [{ name: "DaVinci Resolve" }, { name: "Photoshop / Illustrator avancé" }, { name: "Blender" }] },
  { id: "cat_sport", name: "Sport", sub: "Tous les sports pratiqués, avec le temps réalisé", tasks: [] },
];

const CAT_COLORS = ["#14A38A", "#0B3D39", "#D9A441", "#B0503A", "#5B8A9E", "#8B6BA8", "#6B9E5B", "#C77B9E"];
function catColor(index) { return CAT_COLORS[index % CAT_COLORS.length]; }

const todayKey = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
};
const fmtDateLabel = (key) => {
  const [y, m, d] = key.split("-").map(Number);
  const date = new Date(y, m - 1, d);
  const label = date.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
  return label.charAt(0).toUpperCase() + label.slice(1);
};
const shiftDate = (key, delta) => {
  const [y, m, d] = key.split("-").map(Number);
  const date = new Date(y, m - 1, d);
  date.setDate(date.getDate() + delta);
  return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
};
const uid = (prefix = "t") => `${prefix}_${Math.random().toString(36).slice(2, 10)}`;

function makeInstance(templateTask) {
  return {
    id: templateTask.id,
    mode: templateTask.defaultMode || "hours",
    plannedHours: templateTask.defaultPlannedHours ?? 1,
    plannedPomos: templateTask.defaultPlannedPomos ?? 1,
    doneMinutes: 0,
    donePomos: 0,
    done: false,
  };
}
function plannedMinutes(inst) { return inst.mode === "hours" ? inst.plannedHours * 60 : inst.plannedPomos * POMODORO_MIN; }
function actualMinutes(inst) { return inst.mode === "hours" ? inst.doneMinutes : inst.donePomos * POMODORO_MIN; }

/* ============================================================
   MAIN APP
   ============================================================ */
function App() {
  const [dateKey, setDateKey] = useState(todayKey());
  const [templates, setTemplates] = useState(null);
  const [dayData, setDayData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState("");
  const [syncing, setSyncing] = useState(false);
  const [collapsed, setCollapsed] = useState({});
  const [managerOpen, setManagerOpen] = useState(false);
  const [view, setView] = useState("day");

  const isToday = dateKey === todayKey();

  useEffect(() => {
    (async () => {
      try {
        const res = await storage.get("templates");
        if (res && res.value) {
          setTemplates(JSON.parse(res.value));
        } else {
          const seeded = seedTemplates();
          setTemplates(seeded);
          await storage.set("templates", JSON.stringify(seeded));
        }
      } catch (e) {
        setError("Connexion au serveur impossible. Vérifie ta connexion internet.");
        setTemplates(seedTemplates());
      }
    })();
  }, []);

  function seedTemplates() {
    const categories = DEFAULT_CATEGORIES.map((c) => ({
      id: c.id, name: c.name, sub: c.sub,
      tasks: c.tasks.map((t) => ({
        id: uid("tpl"), name: t.name, defaultMode: "hours", defaultPlannedHours: 1, defaultPlannedPomos: 1,
      })),
    }));
    return { categories };
  }

  const persistTemplates = useCallback(async (next) => {
    setTemplates(next);
    setSyncing(true);
    try {
      await storage.set("templates", JSON.stringify(next));
      setError("");
    } catch {
      setError("Échec de synchronisation du modèle.");
    } finally {
      setSyncing(false);
    }
  }, []);

  useEffect(() => {
    if (!templates) return;
    let cancelled = false;
    setLoading(true);
    (async () => {
      try {
        const res = await storage.get(`day:${dateKey}`);
        const saved = res && res.value ? JSON.parse(res.value) : {};
        const merged = {};
        for (const c of templates.categories) {
          for (const t of c.tasks) merged[t.id] = saved[t.id] || makeInstance(t);
        }
        if (!cancelled) setDayData(merged);
      } catch {
        if (!cancelled) {
          setError("Connexion au serveur impossible.");
          const merged = {};
          for (const c of templates.categories) for (const t of c.tasks) merged[t.id] = makeInstance(t);
          setDayData(merged);
        }
      } finally {
        if (!cancelled) setLoading(false);
      }
    })();
    return () => { cancelled = true; };
  }, [dateKey, templates]);

  const persistDay = useCallback(async (next) => {
    setDayData(next);
    setSyncing(true);
    try {
      await storage.set(`day:${dateKey}`, JSON.stringify(next));
      setError("");
    } catch {
      setError("Échec de synchronisation.");
    } finally {
      setSyncing(false);
    }
  }, [dateKey]);

  const updateInstance = (taskId, patch) => {
    if (!dayData) return;
    persistDay({ ...dayData, [taskId]: { ...dayData[taskId], ...patch } });
  };

  const [activeId, setActiveId] = useState(null);
  const [elapsedSec, setElapsedSec] = useState(0);
  const intervalRef = useRef(null);

  useEffect(() => {
    if (activeId) intervalRef.current = setInterval(() => setElapsedSec((s) => s + 1), 1000);
    return () => clearInterval(intervalRef.current);
  }, [activeId]);

  const startTimer = (id) => { if (activeId && activeId !== id) return; setActiveId(id); };
  const pauseAndCommit = (taskId) => {
    const inst = dayData[taskId];
    const mins = elapsedSec / 60;
    if (inst.mode === "hours") {
      updateInstance(taskId, { doneMinutes: Math.round((inst.doneMinutes + mins) * 10) / 10 });
    } else {
      const pomos = mins / POMODORO_MIN;
      updateInstance(taskId, { donePomos: Math.round((inst.donePomos + pomos) * 100) / 100 });
    }
    setActiveId(null); setElapsedSec(0);
  };
  const finishPomo = (taskId) => {
    updateInstance(taskId, { donePomos: dayData[taskId].donePomos + 1 });
    setActiveId(null); setElapsedSec(0);
  };

  const addTaskToCategory = (catId, name) => {
    if (!name.trim()) return;
    const newTask = { id: uid("tpl"), name: name.trim(), defaultMode: "hours", defaultPlannedHours: 1, defaultPlannedPomos: 1 };
    persistTemplates({ categories: templates.categories.map((c) => c.id === catId ? { ...c, tasks: [...c.tasks, newTask] } : c) });
  };
  const removeTaskFromTemplate = (catId, taskId) => {
    persistTemplates({ categories: templates.categories.map((c) => c.id === catId ? { ...c, tasks: c.tasks.filter((t) => t.id !== taskId) } : c) });
  };
  const renameTemplateTask = (catId, taskId, name) => {
    persistTemplates({ categories: templates.categories.map((c) => c.id === catId ? { ...c, tasks: c.tasks.map((t) => t.id === taskId ? { ...t, name } : t) } : c) });
  };
  const addCategory = (name) => {
    if (!name.trim()) return;
    persistTemplates({ categories: [...templates.categories, { id: uid("cat"), name: name.trim(), sub: "", tasks: [] }] });
  };
  const removeCategory = (catId) => {
    persistTemplates({ categories: templates.categories.filter((c) => c.id !== catId) });
  };
  const toggleCollapse = (catId) => setCollapsed((c) => ({ ...c, [catId]: !c[catId] }));

  const allInstances = dayData ? Object.values(dayData) : [];
  const totalPlanned = allInstances.reduce((a, t) => a + plannedMinutes(t), 0);
  const totalActual = allInstances.reduce((a, t) => a + actualMinutes(t), 0);
  const yieldPct = totalPlanned > 0 ? Math.round((totalActual / totalPlanned) * 100) : 0;
  const doneCount = allInstances.filter((t) => t.done).length;
  const yieldColor = yieldPct >= 90 ? "#14A38A" : yieldPct >= 60 ? "#D9A441" : "#B0503A";

  const ready = templates && dayData && !loading;

  return (
    <div style={styles.page}>
      <div style={styles.container}>
        <div style={styles.headerRow}>
          <div style={styles.brand}>
            <span style={styles.brandMark}>◆</span>
            <span style={styles.brandText}>Cadence</span>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            {syncing && <Icon icon={RefreshCw} size={14} color="#A5A196" style={{ animation: "spin 1s linear infinite" }} />}
            <button style={styles.settingsBtn} onClick={() => setManagerOpen(true)} aria-label="Gérer les catégories">
              <Icon icon={Settings2} size={17} color="#0B3D39" />
            </button>
          </div>
        </div>

        <div style={styles.viewTabs}>
          <button style={{ ...styles.viewTab, ...(view === "day" ? styles.viewTabActive : {}) }} onClick={() => setView("day")}>
            <Icon icon={ListChecks} size={14} color={view === "day" ? "#F7F6F1" : "#6B7268"} />
            Journée
          </button>
          <button style={{ ...styles.viewTab, ...(view === "dashboard" ? styles.viewTabActive : {}) }} onClick={() => setView("dashboard")}>
            <Icon icon={LayoutGrid} size={14} color={view === "dashboard" ? "#F7F6F1" : "#6B7268"} />
            Tableau de bord
          </button>
        </div>

        <div style={styles.dateNav}>
          <button style={styles.navBtn} onClick={() => setDateKey(shiftDate(dateKey, -1))} aria-label="Jour précédent">
            <Icon icon={ChevronLeft} size={18} color="#0B3D39" />
          </button>
          <div style={styles.dateBlock}>
            <div style={styles.dateLabel}>{fmtDateLabel(dateKey)}</div>
            {!isToday && <button style={styles.todayLink} onClick={() => setDateKey(todayKey())}>Revenir à aujourd'hui</button>}
          </div>
          <button style={styles.navBtn} onClick={() => setDateKey(shiftDate(dateKey, 1))} aria-label="Jour suivant">
            <Icon icon={ChevronRight} size={18} color="#0B3D39" />
          </button>
        </div>

        <div style={styles.summary}>
          <div style={styles.summaryItem}>
            <div style={{ ...styles.summaryNum, color: yieldColor }}>{allInstances.length ? `${yieldPct}%` : "—"}</div>
            <div style={styles.summaryLabel}>Rendement réel</div>
          </div>
          <div style={styles.summaryDivider} />
          <div style={styles.summaryItem}>
            <div style={styles.summaryNum}>{(totalActual / 60).toFixed(1)}<span style={styles.summaryUnit}> / {(totalPlanned / 60).toFixed(1)} h</span></div>
            <div style={styles.summaryLabel}>Temps réalisé</div>
          </div>
          <div style={styles.summaryDivider} />
          <div style={styles.summaryItem}>
            <div style={styles.summaryNum}>{doneCount}<span style={styles.summaryUnit}> / {allInstances.length}</span></div>
            <div style={styles.summaryLabel}>Tâches terminées</div>
          </div>
        </div>

        {error && (
          <div style={styles.errorBanner}>
            <Icon icon={WifiOff} size={13} color="#B0503A" style={{ marginLeft: 6, verticalAlign: "middle" }} /> {error}
          </div>
        )}

        {!ready ? (
          <div style={styles.emptyState}>Chargement…</div>
        ) : view === "day" ? (
          <div style={styles.categoryList}>
            {templates.categories.map((cat) => (
              <CategoryBlock
                key={cat.id}
                category={cat}
                dayData={dayData}
                collapsed={!!collapsed[cat.id]}
                onToggle={() => toggleCollapse(cat.id)}
                activeId={activeId}
                elapsedSec={elapsedSec}
                onUpdateInstance={updateInstance}
                onStart={startTimer}
                onPause={pauseAndCommit}
                onFinishPomo={finishPomo}
                onAddTask={(name) => addTaskToCategory(cat.id, name)}
              />
            ))}
          </div>
        ) : (
          <Dashboard templates={templates} dayData={dayData} dateLabel={fmtDateLabel(dateKey)} />
        )}
      </div>

      {managerOpen && templates && (
        <ManagerModal
          templates={templates}
          onClose={() => setManagerOpen(false)}
          onAddCategory={addCategory}
          onRemoveCategory={removeCategory}
          onAddTask={addTaskToCategory}
          onRemoveTask={removeTaskFromTemplate}
          onRenameTask={renameTemplateTask}
        />
      )}
    </div>
  );
}

/* ============================================================
   DASHBOARD — vue analytique du jour sélectionné
   ============================================================ */
function Dashboard({ templates, dayData, dateLabel }) {
  const catStats = useMemo(() => {
    return templates.categories.map((cat, idx) => {
      const instances = cat.tasks.map((t) => dayData[t.id]).filter(Boolean);
      const planned = instances.reduce((a, i) => a + plannedMinutes(i), 0);
      const actual = instances.reduce((a, i) => a + actualMinutes(i), 0);
      const done = instances.filter((i) => i.done).length;
      return { id: cat.id, name: cat.name, planned, actual, done, total: instances.length, color: catColor(idx) };
    }).filter((c) => c.total > 0);
  }, [templates, dayData]);

  const allInstances = Object.values(dayData);
  const totalPlanned = allInstances.reduce((a, t) => a + plannedMinutes(t), 0);
  const totalActual = allInstances.reduce((a, t) => a + actualMinutes(t), 0);
  const yieldPct = totalPlanned > 0 ? Math.round((totalActual / totalPlanned) * 100) : 0;
  const doneCount = allInstances.filter((t) => t.done).length;
  const overrunCount = allInstances.filter((t) => actualMinutes(t) > plannedMinutes(t) && plannedMinutes(t) > 0).length;
  const maxMinutes = Math.max(1, ...catStats.map((c) => Math.max(c.planned, c.actual)));

  const totalActiveTime = catStats.reduce((a, c) => a + c.actual, 0);
  let cumulative = 0;
  const donutStops = catStats
    .filter((c) => c.actual > 0)
    .map((c) => {
      const start = (cumulative / (totalActiveTime || 1)) * 360;
      cumulative += c.actual;
      const end = (cumulative / (totalActiveTime || 1)) * 360;
      return `${c.color} ${start}deg ${end}deg`;
    });
  const donutBg = donutStops.length > 0 ? `conic-gradient(${donutStops.join(", ")})` : "#EFEDE4";

  return (
    <div>

          <div style={styles.kpiNum}>{(totalActual / 60).toFixed(1)}h</div>
          <div style={styles.kpiLabel}>Temps total</div>

      </div>

      {catStats.length === 0 ? (
        <div style={styles.emptyState}>Aucune tâche configurée pour l'instant.</div>

          <div style={styles.chartCard}>
            <div style={styles.chartTitle}>Répartition du temps réalisé</div>
            <div style={styles.donutRow}>

                    <span style={styles.legendVal}>{(c.actual / 60).toFixed(1)}h</span>
                  </div>
                ))}
                {catStats.every((c) => c.actual === 0) && (
                  <div style={{ fontSize: 12, color: "#A5A196" }}>Aucun temps enregistré encore aujourd'hui.</div>

            <div style={styles.chartTitle}>Prévu vs réalisé par catégorie</div>
            <div style={styles.barChartLegendRow}>
              <span style={styles.barLegendItem}><span style={{ ...styles.barLegendSwatch, background: "#E4E1D6" }} /> Prévu</span>
              <span style={styles.barLegendItem}><span style={{ ...styles.barLegendSwatch, background: "#0B3D39" }} /> Réalisé</span>
            </div>
            <div style={styles.barList}>
              {catStats.map((c) => (
                <div key={c.id} style={styles.barRow}>
                  <div style={styles.barRowLabel}>{c.name}</div>
                  <div style={styles.barTrackWrap}>
                    <div style={styles.barTrackBg}>
                      <div style={{ ...styles.barTrackFill, width: `${(c.planned / maxMinutes) * 100}%`, background: "#E4E1D6" }} />
                    </div>
                    <div style={styles.barTrackBg}>
                      <div style={{ ...styles.barTrackFill, width: `${(c.actual / maxMinutes) * 100}%`, background: c.actual > c.planned && c.planned > 0 ? "#B0503A" : "#0B3D39" }} />
                    </div>
                  </div>
                  <div style={styles.barRowVal}>{(c.actual / 60).toFixed(1)} / {(c.planned / 60).toFixed(1)} h</div>
                </div>
              ))}
            </div>
          </div>

          <div style={styles.chartCard}>
            <div style={styles.chartTitle}>Détail des tâches</div>
            <div style={styles.taskTable}>
              {templates.categories.map((cat) =>
                cat.tasks.map((t) => {
                  const inst = dayData[t.id];
                  if (!inst) return null;
                  const planned = plannedMinutes(inst);
                  const actual = actualMinutes(inst);
                  const over = actual > planned && planned > 0;
                  const statusLabel = inst.done ? "Terminée" : actual > 0 ? "En cours" : "Non commencée";
                  const statusColor = inst.done ? "#14A38A" : actual > 0 ? "#D9A441" : "#A5A196";
                  return (
                    <div key={t.id} style={styles.taskTableRow}>
                      <div style={styles.taskTableMain}>
                        <div style={styles.taskTableName}>{t.name}</div>
                        <div style={styles.taskTableCat}>{cat.name}</div>
                      </div>
                      <div style={styles.taskTableTime}>
                        {inst.mode === "hours" ? `${(actual / 60).toFixed(1)}/${inst.plannedHours}h` : `${(actual / POMODORO_MIN).toFixed(1)}/${inst.plannedPomos} cy.`}
                        {over && <span style={{ color: "#B0503A" }}> ⚠</span>}
                      </div>
                      <div style={{ ...styles.taskTableStatus, color: statusColor, borderColor: statusColor }}>{statusLabel}</div>
                    </div>
                  );
                })
              )}
            </div>
          </div>
        </>
      )}
    </div>
  );
}

/* ============================================================
   CATEGORY BLOCK
   ============================================================ */
function CategoryBlock({ category, dayData, collapsed, onToggle, activeId, elapsedSec, onUpdateInstance, onStart, onPause, onFinishPomo, onAddTask }) {
  const [addingName, setAddingName] = useState("");
  const [showAdd, setShowAdd] = useState(false);

  const instances = category.tasks.map((t) => dayData[t.id]).filter(Boolean);
  const planned = instances.reduce((a, i) => a + plannedMinutes(i), 0);
  const actual = instances.reduce((a, i) => a + actualMinutes(i) + (activeId === i.id ? elapsedSec / 60 : 0), 0);
  const pct = planned > 0 ? Math.min(100, Math.round((actual / planned) * 100)) : 0;
  const doneCount = instances.filter((i) => i.done).length;

  const submitAdd = () => { if (addingName.trim()) { onAddTask(addingName.trim()); setAddingName(""); setShowAdd(false); } };

  return (
    <div style={styles.catBlock}>
      <button style={styles.catHeader} onClick={onToggle}>
        <Icon icon={ChevronDown} size={16} color="#8A8676" style={{ transform: collapsed ? "rotate(-90deg)" : "rotate(0deg)", transition: "transform 0.2s ease" }} />
        <div style={styles.catHeaderText}>
          <div style={styles.catName}>{category.name}</div>
          {category.sub && <div style={styles.catSub}>{category.sub}</div>}
        </div>
        {instances.length > 0 && (
          <div style={styles.catMeta}>
            <span style={styles.catMetaCount}>{doneCount}/{instances.length}</span>
            <div style={styles.catMiniTrack}><div style={{ ...styles.catMiniFill, width: `${pct}%` }} /></div>
          </div>
        )}
      </button>

      {!collapsed && (
        <div style={styles.catBody}>
          {category.tasks.map((t) => {
            const inst = dayData[t.id];
            if (!inst) return null;
            return (
              <TaskRow
                key={t.id} name={t.name} inst={inst}
                isActive={activeId === t.id}
                elapsedSec={activeId === t.id ? elapsedSec : 0}
                otherActive={!!activeId && activeId !== t.id}
                onUpdate={(patch) => onUpdateInstance(t.id, patch)}
                onStart={() => onStart(t.id)}
                onPause={() => onPause(t.id)}
                onFinishPomo={() => onFinishPomo(t.id)}
              />
            );
          })}

          {category.tasks.length === 0 && !showAdd && <div style={styles.catEmptyHint}>Aucune sous-tâche pour l'instant.</div>}

          {showAdd ? (
            <div style={styles.inlineAddRow}>
              <input autoFocus style={styles.inlineAddInput} placeholder="Nom de la sous-tâche…"
                value={addingName} onChange={(e) => setAddingName(e.target.value)}
                onKeyDown={(e) => { if (e.key === "Enter") submitAdd(); if (e.key === "Escape") setShowAdd(false); }} />
              <button style={styles.inlineAddConfirm} onClick={submitAdd}>Ajouter</button>
              <button style={styles.inlineAddCancel} onClick={() => setShowAdd(false)}><Icon icon={X} size={14} color="#8A8676" /></button>
            </div>
          ) : (
            <button style={styles.addSubtaskBtn} onClick={() => setShowAdd(true)}><Icon icon={Plus} size={13} color="#14A38A" /> Ajouter une sous-tâche</button>
          )}
          <div style={styles.propagateNote}>Ajoutée ici, elle apparaîtra pour tous les jours suivants.</div>
        </div>
      )}
    </div>
  );
}

/* ============================================================
   TASK ROW
   ============================================================ */
function TaskRow({ name, inst, isActive, elapsedSec, otherActive, onUpdate, onStart, onPause, onFinishPomo }) {
  const planned = plannedMinutes(inst);
  const actual = actualMinutes(inst) + (isActive ? elapsedSec / 60 : 0);
  const pct = planned > 0 ? Math.min(100, Math.round((actual / planned) * 100)) : 0;
  const over = actual > planned && planned > 0;
  const barColor = over ? "#B0503A" : pct >= 90 ? "#14A38A" : "#D9A441";

  const fmtTimer = (sec) => {
    const m = Math.floor(sec / 60).toString().padStart(2, "0");
    const s = (sec % 60).toString().padStart(2, "0");
    return `${m}:${s}`;
  };

  return (
    <div style={{ ...styles.taskRow, opacity: inst.done ? 0.55 : 1 }}>
      <div style={styles.taskTop}>
        <button style={{ ...styles.checkBtn, background: inst.done ? "#14A38A" : "transparent", borderColor: inst.done ? "#14A38A" : "#D5D1C4" }}
          onClick={() => onUpdate({ done: !inst.done })} aria-label="Marquer comme terminée">
          {inst.done && <Icon icon={Check} size={12} color="#FFFFFF" strokeWidth={3} />}
        </button>
        <span style={{ ...styles.taskName, textDecoration: inst.done ? "line-through" : "none" }}>{name}</span>
      </div>

      <div style={styles.taskControls}>
        <div style={styles.modeSwitch}>
          <button style={{ ...styles.modeBtn, ...(inst.mode === "hours" ? styles.modeBtnActive : {}) }} onClick={() => onUpdate({ mode: "hours" })}>Heures</button>
          <button style={{ ...styles.modeBtn, ...(inst.mode === "pomodoro" ? styles.modeBtnActive : {}) }} onClick={() => onUpdate({ mode: "pomodoro" })}>Cycles</button>
        </div>

        {inst.mode === "hours" ? (
          <div style={styles.numStepper}>
            <button style={styles.stepBtn} onClick={() => onUpdate({ plannedHours: Math.max(0.5, inst.plannedHours - 0.5) })}>−</button>
            <span style={styles.stepVal}>{inst.plannedHours} h</span>
            <button style={styles.stepBtn} onClick={() => onUpdate({ plannedHours: inst.plannedHours + 0.5 })}>+</button>
          </div>
        ) : (
          <div style={styles.numStepper}>
            <button style={styles.stepBtn} onClick={() => onUpdate({ plannedPomos: Math.max(1, inst.plannedPomos - 1) })}>−</button>
            <span style={styles.stepVal}>{inst.plannedPomos} cy.</span>
            <button style={styles.stepBtn} onClick={() => onUpdate({ plannedPomos: inst.plannedPomos + 1 })}>+</button>
          </div>
        )}

        <div style={styles.timerZone}>
          {isActive ? (
            <>
              <span style={styles.timerText}>{fmtTimer(elapsedSec)}</span>
              <button style={styles.iconBtnAccent} onClick={onPause} aria-label="Mettre en pause"><Icon icon={Pause} size={13} color="#FFFFFF" /></button>
              {inst.mode === "pomodoro" && (
                <button style={styles.iconBtnOutline} onClick={onFinishPomo} aria-label="Valider un cycle"><Icon icon={RotateCcw} size={12} color="#14A38A" /></button>
              )}
            </>
          ) : (
            <button style={{ ...styles.iconBtnAccent, opacity: otherActive ? 0.3 : 1 }} onClick={onStart} disabled={otherActive} aria-label="Démarrer">
              <Icon icon={Play} size={13} color="#FFFFFF" />
            </button>
          )}
        </div>
      </div>

      <div style={styles.progressTrack}><div style={{ ...styles.progressFill, width: `${pct}%`, background: barColor }} /></div>
      <div style={styles.progressLabel}>
        {inst.mode === "hours" ? `${(actual / 60).toFixed(1)} / ${inst.plannedHours} h` : `${(actual / POMODORO_MIN).toFixed(1)} / ${inst.plannedPomos} cycles`}
        {over && <span style={{ color: "#B0503A" }}> · dépassement</span>}
      </div>
    </div>
  );
}

/* ============================================================
   MANAGER MODAL
   ============================================================ */
function ManagerModal({ templates, onClose, onAddCategory, onRemoveCategory, onAddTask, onRemoveTask, onRenameTask }) {
  const [newCatName, setNewCatName] = useState("");
  const [addingTo, setAddingTo] = useState(null);
  const [newTaskName, setNewTaskName] = useState("");

  return (
    <div style={styles.modalOverlay} onClick={onClose}>
      <div style={styles.modalPanel} onClick={(e) => e.stopPropagation()}>
        <div style={styles.modalHeader}>
          <span style={styles.modalTitle}>Gérer les catégories & tâches</span>
          <button style={styles.modalClose} onClick={onClose}><Icon icon={X} size={18} color="#6B7268" /></button>
        </div>
        <div style={styles.modalSubtext}>Toute modification ici s'applique à tous les jours à venir. Les jours passés restent inchangés.</div>

        <div style={styles.modalBody}>
          {templates.categories.map((cat) => (
            <div key={cat.id} style={styles.modalCatCard}>
              <div style={styles.modalCatHeader}>
                <span style={styles.modalCatName}>{cat.name}</span>
                <button style={styles.modalDeleteCat} onClick={() => onRemoveCategory(cat.id)} aria-label="Supprimer la catégorie">
                  <Icon icon={Trash2} size={14} color="#8A8676" />
                </button>
              </div>
              <div style={styles.modalTaskList}>
                {cat.tasks.map((t) => (
                  <div key={t.id} style={styles.modalTaskRow}>
                    <Icon icon={GripVertical} size={13} color="#C7C3B6" />
                    <input style={styles.modalTaskInput} value={t.name} onChange={(e) => onRenameTask(cat.id, t.id, e.target.value)} />
                    <button style={styles.modalTaskDelete} onClick={() => onRemoveTask(cat.id, t.id)} aria-label="Supprimer">
                      <Icon icon={Trash2} size={13} color="#A5A196" />
                    </button>
                  </div>
                ))}
              </div>

              {addingTo === cat.id ? (
                <div style={styles.inlineAddRow}>
                  <input autoFocus style={styles.inlineAddInput} placeholder="Nouvelle sous-tâche…" value={newTaskName}
                    onChange={(e) => setNewTaskName(e.target.value)}
                    onKeyDown={(e) => {
                      if (e.key === "Enter" && newTaskName.trim()) { onAddTask(cat.id, newTaskName.trim()); setNewTaskName(""); setAddingTo(null); }
                      if (e.key === "Escape") setAddingTo(null);
                    }} />
                  <button style={styles.inlineAddConfirm} onClick={() => { if (newTaskName.trim()) { onAddTask(cat.id, newTaskName.trim()); setNewTaskName(""); setAddingTo(null); } }}>Ajouter</button>
                </div>
              ) : (
                <button style={styles.addSubtaskBtn} onClick={() => setAddingTo(cat.id)}><Icon icon={Plus} size={13} color="#14A38A" /> Ajouter une sous-tâche</button>
              )}
            </div>
          ))}

          <div style={styles.modalNewCatRow}>
            <input style={styles.modalNewCatInput} placeholder="Nom d'une nouvelle catégorie (ex : Lecture)" value={newCatName}
              onChange={(e) => setNewCatName(e.target.value)}
              onKeyDown={(e) => { if (e.key === "Enter" && newCatName.trim()) { onAddCategory(newCatName.trim()); setNewCatName(""); } }} />
            <button style={styles.modalNewCatBtn} onClick={() => { if (newCatName.trim()) { onAddCategory(newCatName.trim()); setNewCatName(""); } }}>
              <Icon icon={Plus} size={16} color="#FFFFFF" />
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}
