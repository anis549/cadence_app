/* ============================================================
   CONFIG
   ============================================================ */
const API_URL = "https://script.google.com/macros/s/AKfycbxao2LUjkLV_O3JQ2Del1HFUrMBDSY896wtXWzctEcDJt2nZdmQqKMMM-VULMpRKd_p/exec";

/* ============================================================
   STORAGE LAYER — appels API vers le Google Sheet (Apps Script)
   ============================================================ */
const storage = {
  async get(key) {
    const res = await fetch(`${API_URL}?action=get&key=${encodeURIComponent(key)}`);
    const data = await res.json();
    if (!data.found) return null;
    return { key, value: data.value, shared: false };
  },
  async set(key, value) {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "set", key, value }),
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    return { key, value, shared: false };
  },
  async delete(key) {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "delete", key }),
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    return { key, deleted: true, shared: false };
  },
  async list(prefix = "") {
    const res = await fetch(`${API_URL}?action=list&prefix=${encodeURIComponent(prefix)}`);
    const data = await res.json();
    return { keys: data.keys || [], prefix, shared: false };
  },
};

/* ============================================================
   OFFLINE LAYER — cache local (localStorage) + file d'attente
   de synchronisation. Toute écriture réussit immédiatement en
   local ; elle se synchronise avec le Google Sheet dès que la
   connexion revient (automatique, sans action de l'utilisateur).
   ============================================================ */
const LS_PREFIX = "cadence_cache_";
const LS_QUEUE = "cadence_sync_queue";

function lsGet(key) {
  try { return localStorage.getItem(LS_PREFIX + key); } catch { return null; }
}
function lsSet(key, value) {
  try { localStorage.setItem(LS_PREFIX + key, value); } catch {}
}
function getQueue() {
  try { const raw = localStorage.getItem(LS_QUEUE); return raw ? JSON.parse(raw) : {}; } catch { return {}; }
}
function setQueueMap(q) {
  try { localStorage.setItem(LS_QUEUE, JSON.stringify(q)); } catch {}
}
function queueSet(key, value) {
  const q = getQueue(); q[key] = value; setQueueMap(q);
}
function queueClear(key) {
  const q = getQueue(); delete q[key]; setQueueMap(q);
}
function queueCount() { return Object.keys(getQueue()).length; }

let flushListeners = [];
function onQueueChange(fn) { flushListeners.push(fn); }
function notifyQueueChange() { flushListeners.forEach((fn) => fn(queueCount())); }

async function flushQueue() {
  if (!navigator.onLine) return;
  const q = getQueue();
  const keys = Object.keys(q);
  for (const key of keys) {
    try {
      await storage._networkSet(key, q[key]);
      queueClear(key);
      notifyQueueChange();
    } catch {
      break; // stop here, retry later — keeps remaining items queued in order
    }
  }
}

const offlineStorage = {
  _networkSet: storage.set,
  _networkGet: storage.get,

  async get(key) {
    // Toujours retourner le cache local en premier (instantané, marche hors-ligne)
    const cached = lsGet(key);
    if (navigator.onLine) {
      try {
        const res = await storage.get(key);
        if (res) lsSet(key, res.value);
        return res || (cached !== null ? { key, value: cached, shared: false } : null);
      } catch {
        return cached !== null ? { key, value: cached, shared: false } : null;
      }
    }
    return cached !== null ? { key, value: cached, shared: false } : null;
  },

  async set(key, value) {
    lsSet(key, value); // écriture locale instantanée — ne jamais bloquer l'utilisateur
    if (navigator.onLine) {
      try {
        await storage.set(key, value);
        queueClear(key);
        notifyQueueChange();
        return { key, value, shared: false };
      } catch {
        queueSet(key, value);
        notifyQueueChange();
        return { key, value, shared: false };
      }
    }
    queueSet(key, value);
    notifyQueueChange();
    return { key, value, shared: false };
  },

  async delete(key) {
    try { localStorage.removeItem(LS_PREFIX + key); } catch {}
    queueClear(key);
    notifyQueueChange();
    if (navigator.onLine) {
      try { await storage.delete(key); } catch {}
    }
    return { key, deleted: true, shared: false };
  },

  async list(prefix = "") {
    if (navigator.onLine) {
      try { return await storage.list(prefix); } catch {}
    }
    // liste locale de secours à partir du cache
    try {
      const keys = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith(LS_PREFIX)) {
          const realKey = k.slice(LS_PREFIX.length);
          if (realKey.startsWith(prefix)) keys.push(realKey);
        }
      }
      return { keys, prefix, shared: false };
    } catch {
      return { keys: [], prefix, shared: false };
    }
  },
};

window.addEventListener("online", () => { flushQueue(); });
setInterval(() => { if (navigator.onLine) flushQueue(); }, 20000);

function makeInstance(templateTask) {

function plannedMinutes(inst) { return inst.mode === "hours" ? inst.plannedHours * 60 : inst.plannedPomos * POMODORO_MIN; }

/* ============================================================
   HISTORIQUE — lecture des jours passés pour les statistiques
   (comparaison hebdo/mensuelle, streak, suggestions)
   ============================================================ */
async function fetchDayRaw(dateKey) {
  try {
    const res = await offlineStorage.get(`day:${dateKey}`);
    if (!res || !res.value) return null;
    return JSON.parse(res.value);
  } catch { return null; }
}
function dayYieldFromRaw(rawObj) {
  if (!rawObj) return null;
  const instances = Object.values(rawObj);
  const planned = instances.reduce((a, i) => a + plannedMinutes(i), 0);
  const actual = instances.reduce((a, i) => a + actualMinutes(i), 0);
  if (planned === 0) return { planned, actual, yieldPct: null };
  return { planned, actual, yieldPct: Math.round((actual / planned) * 100) };
}
const WEEKDAY_SHORT_FR = ["dim", "lun", "mar", "mer", "jeu", "ven", "sam"];
function shortDayLabel(dateKey) {
  const [y, m, d] = dateKey.split("-").map(Number);
  const date = new Date(y, m - 1, d);
  return WEEKDAY_SHORT_FR[date.getDay()];
}

/* ============================================================
   SONS, VIBRATIONS, NOTIFICATIONS — pour les cycles Pomodoro
   et le rappel quotidien
   ============================================================ */
function playBeep() {
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    const ctx = new Ctx();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = "sine";
    o.frequency.value = 880;
    g.gain.value = 0.001;
    o.connect(g); g.connect(ctx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.2, ctx.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
    setTimeout(() => { o.stop(); ctx.close(); }, 550);
  } catch {}
}
function vibrate(pattern) {
  try { if (navigator.vibrate) navigator.vibrate(pattern); } catch {}
}
function canNotify() {
  return "Notification" in window && Notification.permission === "granted";
}
async function requestNotifPermission() {
  try {
    if (!("Notification" in window)) return false;
    if (Notification.permission === "granted") return true;
    const res = await Notification.requestPermission();
    return res === "granted";
  } catch { return false; }
}
function notify(title, body) {
  if (canNotify()) {
    try { new Notification(title, { body, icon: undefined }); } catch {}
  }
}
function notifyCycleComplete(taskName) {
  vibrate([180, 90, 180]);
  playBeep();
  notify("Cycle terminé 🍅", `${taskName || "Ta tâche"} — 25 minutes accomplies. Nouveau cycle en cours.`);
}
function maybeShowDailyReminder() {
  try {
    const lastShown = localStorage.getItem("cadence_last_daily_notif");
    const today = todayKey();
    if (lastShown !== today && canNotify()) {
      notify("Cadence", "Ta journée est prête. Ouvre l'app pour voir ton plan du jour.");
      localStorage.setItem("cadence_last_daily_notif", today);
    }
  } catch {}
}

}

function App() {

  const [view, setView] = useState("day");
  const [isOnline, setIsOnline] = useState(navigator.onLine);
  const [pendingCount, setPendingCount] = useState(queueCount());
  const [focusMode, setFocusMode] = useState(false);
  const [notifPermission, setNotifPermission] = useState(
    typeof Notification !== "undefined" ? Notification.permission : "unsupported"
  );

  useEffect(() => {
    maybeShowDailyReminder();
    flushQueue();
  }, []);

  useEffect(() => {
    const goOnline = () => { setIsOnline(true); flushQueue(); };
    const goOffline = () => setIsOnline(false);
    window.addEventListener("online", goOnline);
    window.addEventListener("offline", goOffline);
    onQueueChange(setPendingCount);
    return () => {
      window.removeEventListener("online", goOnline);
      window.removeEventListener("offline", goOffline);
    };
  }, []);

  const isToday = dateKey === todayKey();

  useEffect(() => {
    (async () => {
      try {
        const res = await offlineStorage.get("templates");
        if (res && res.value) {
          setTemplates(JSON.parse(res.value));
        } else {
          const seeded = seedTemplates();
          setTemplates(seeded);
          await offlineStorage.set("templates", JSON.stringify(seeded));
        }
      } catch (e) {
        setError("Connexion au serveur impossible. Vérifie ta connexion internet.");
        setTemplates(seedTemplates());
      }
    })();
  }, []);

  function seedTemplates() {
    const categories = DEFAULT_CATEGORIES.map((c) => ({
      id: c.id, name: c.name, sub: c.sub,
      tasks: c.tasks.map((t) => ({
        id: uid("tpl"), name: t.name, defaultMode: "hours", defaultPlannedHours: 1, defaultPlannedPomos: 1,
      })),
    }));
    return { categories };
  }

  const persistTemplates = useCallback(async (next) => {
    setTemplates(next);
    setSyncing(true);
    try {
      await offlineStorage.set("templates", JSON.stringify(next));
      setError("");
    } catch {
      setError("Échec de synchronisation du modèle.");
    } finally {
      setSyncing(false);
    }
  }, []);

  useEffect(() => {
    if (!templates) return;
    let cancelled = false;
    setLoading(true);
    (async () => {
      try {
        const res = await offlineStorage.get(`day:${dateKey}`);
        const saved = res && res.value ? JSON.parse(res.value) : {};
        const merged = {};
        for (const c of templates.categories) {
          for (const t of c.tasks) merged[t.id] = saved[t.id] || makeInstance(t);
        }
        if (!cancelled) setDayData(merged);
      } catch {
        if (!cancelled) {
          setError("Connexion au serveur impossible.");
          const merged = {};
          for (const c of templates.categories) for (const t of c.tasks) merged[t.id] = makeInstance(t);
          setDayData(merged);
        }
      } finally {
        if (!cancelled) setLoading(false);
      }
    })();
    return () => { cancelled = true; };
  }, [dateKey, templates]);

  const persistDay = useCallback(async (next) => {
    setDayData(next);
    setSyncing(true);
    try {
      await offlineStorage.set(`day:${dateKey}`, JSON.stringify(next));
      setError("");
    } catch {
      setError("Échec de synchronisation.");
    } finally {
      setSyncing(false);
    }
  }, [dateKey]);

  const updateInstance = (taskId, patch) => {
    if (!dayData) return;
    persistDay({ ...dayData, [taskId]: { ...dayData[taskId], ...patch } });
  };

  /* ---- chrono persistant : basé sur une vraie horloge (timestamp),
     donc il continue même si l'app est fermée puis rouverte ---- */
  const [activeId, setActiveId] = useState(() => { const t = getActiveTimer(); return t ? t.taskId : null; });
  const [activeStartedAt, setActiveStartedAt] = useState(() => { const t = getActiveTimer(); return t ? t.startedAt : null; });
  const [activeDateKey, setActiveDateKey] = useState(() => { const t = getActiveTimer(); return t ? t.dateKey : null; });
  const [activeMode, setActiveMode] = useState(() => { const t = getActiveTimer(); return t ? (t.mode || "hours") : null; });
  const [elapsedSec, setElapsedSec] = useState(() => {
    const t = getActiveTimer();
    return t ? Math.max(0, Math.floor((Date.now() - t.startedAt) / 1000)) : 0;
  });
  const intervalRef = useRef(null);

  const findTaskName = useCallback((taskId) => {
    if (!templates) return "";
    for (const cat of templates.categories) {
      const t = cat.tasks.find((x) => x.id === taskId);
      if (t) return t.name;
    }
    return "";
  }, [templates]);

  useEffect(() => {
    if (activeId && activeStartedAt) {
      intervalRef.current = setInterval(() => {
        const now = Date.now();
        let startedAt = activeStartedAt;
        let sec = Math.max(0, Math.floor((now - startedAt) / 1000));

        if (activeMode === "pomodoro") {
          const completedCycles = Math.floor(sec / (POMODORO_MIN * 60));
          if (completedCycles > 0) {
            const newStartedAt = startedAt + completedCycles * POMODORO_MIN * 60 * 1000;
            const targetDateKey = activeDateKey || dateKey;
            commitElapsedToDay(targetDateKey, activeId, completedCycles * POMODORO_MIN);
            setActiveTimer({ taskId: activeId, dateKey: targetDateKey, startedAt: newStartedAt, mode: activeMode });
            setActiveStartedAt(newStartedAt);
            notifyCycleComplete(findTaskName(activeId));
            sec = Math.max(0, Math.floor((now - newStartedAt) / 1000));
          }
        }
        setElapsedSec(sec);
      }, 1000);
    }
    return () => clearInterval(intervalRef.current);
  }, [activeId, activeStartedAt, activeMode]);

  // si l'onglet redevient visible (retour dans l'app), on recale immédiatement sur l'heure réelle
  useEffect(() => {
    const onVisible = () => {
      if (document.visibilityState === "visible" && activeId && activeStartedAt) {
        setElapsedSec(Math.max(0, Math.floor((Date.now() - activeStartedAt) / 1000)));
      }
    };
    document.addEventListener("visibilitychange", onVisible);
    return () => document.removeEventListener("visibilitychange", onVisible);
  }, [activeId, activeStartedAt]);

  const startTimer = (id) => {
    if (activeId && activeId !== id) return;
    const startedAt = Date.now();
    const mode = (dayData && dayData[id] && dayData[id].mode) || "hours";
    setActiveId(id);
    setActiveStartedAt(startedAt);
    setActiveDateKey(dateKey);
    setActiveMode(mode);
    setElapsedSec(0);
    setActiveTimer({ taskId: id, dateKey, startedAt, mode });
  };

  // applique le temps écoulé à l'instance de tâche, même si le jour visé
  // n'est plus le jour affiché à l'écran (l'utilisateur a changé de jour
  // pendant que le chrono tournait en arrière-plan)
  const commitElapsedToDay = useCallback(async (targetDateKey, taskId, mins, extraPatch) => {
    if (targetDateKey === dateKey && dayData) {
      const inst = dayData[taskId];
      if (!inst) return;
      if (inst.mode === "hours") {
        updateInstance(taskId, { doneMinutes: Math.round((inst.doneMinutes + mins) * 10) / 10, ...extraPatch });
      } else {
        const pomos = mins / POMODORO_MIN;
        updateInstance(taskId, { donePomos: Math.round((inst.donePomos + pomos) * 100) / 100, ...extraPatch });
      }
      return;
    }
    // jour différent : on charge, on modifie, on sauvegarde ce jour-là spécifiquement
    try {
      const res = await offlineStorage.get(`day:${targetDateKey}`);
      const saved = res && res.value ? JSON.parse(res.value) : {};
      const inst = saved[taskId] || (templates ? makeInstance(templates.categories.flatMap((c) => c.tasks).find((t) => t.id === taskId) || { id: taskId }) : null);
      if (!inst) return;
      if (inst.mode === "hours") {
        inst.doneMinutes = Math.round((inst.doneMinutes + mins) * 10) / 10;
      } else {
        inst.donePomos = Math.round((inst.donePomos + mins / POMODORO_MIN) * 100) / 100;
      }
      if (extraPatch) Object.assign(inst, extraPatch);
      saved[taskId] = inst;
      await offlineStorage.set(`day:${targetDateKey}`, JSON.stringify(saved));
    } catch {}
  }, [dateKey, dayData, templates]);

  const pauseAndCommit = async (taskId) => {
    const mins = Math.max(0, (Date.now() - activeStartedAt) / 60000);
    const targetDateKey = activeDateKey || dateKey;
    clearActiveTimer();
    setActiveId(null); setActiveStartedAt(null); setActiveDateKey(null); setElapsedSec(0);
    await commitElapsedToDay(targetDateKey, taskId, mins);
  };
  const finishPomo = async (taskId) => {
    const targetDateKey = activeDateKey || dateKey;
    clearActiveTimer();
    setActiveId(null); setActiveStartedAt(null); setActiveDateKey(null); setElapsedSec(0);
    if (targetDateKey === dateKey && dayData) {
      updateInstance(taskId, { donePomos: dayData[taskId].donePomos + 1 });
    } else {
      await commitElapsedToDay(targetDateKey, taskId, 0, {});
      try {
        const res = await offlineStorage.get(`day:${targetDateKey}`);
        const saved = res && res.value ? JSON.parse(res.value) : {};
        if (saved[taskId]) {
          saved[taskId].donePomos = (saved[taskId].donePomos || 0) + 1;
          await offlineStorage.set(`day:${targetDateKey}`, JSON.stringify(saved));
        }
      } catch {}
    }
  };

  const addTaskToCategory = (catId, name) => {
    if (!name.trim()) return;
    const newTask = { id: uid("tpl"), name: name.trim(), defaultMode: "hours", defaultPlannedHours: 1, defaultPlannedPomos: 1 };
    persistTemplates({ categories: templates.categories.map((c) => c.id === catId ? { ...c, tasks: [...c.tasks, newTask] } : c) });
  };
  const removeTaskFromTemplate = (catId, taskId) => {
    persistTemplates({ categories: templates.categories.map((c) => c.id === catId ? { ...c, tasks: c.tasks.filter((t) => t.id !== taskId) } : c) });
  };
  const renameTemplateTask = (catId, taskId, name) => {
    persistTemplates({ categories: templates.categories.map((c) => c.id === catId ? { ...c, tasks: c.tasks.map((t) => t.id === taskId ? { ...t, name } : t) } : c) });
  };
  const addCategory = (name) => {
    if (!name.trim()) return;
    persistTemplates({ categories: [...templates.categories, { id: uid("cat"), name: name.trim(), sub: "", tasks: [] }] });
  };
  const removeCategory = (catId) => {
    persistTemplates({ categories: templates.categories.filter((c) => c.id !== catId) });
  };
  const toggleCollapse = (catId) => setCollapsed((c) => ({ ...c, [catId]: !c[catId] }));

  const allInstances = dayData ? Object.values(dayData) : [];
  const totalPlanned = allInstances.reduce((a, t) => a + plannedMinutes(t), 0);
  const totalActual = allInstances.reduce((a, t) => a + actualMinutes(t), 0);
  const yieldPct = totalPlanned > 0 ? Math.round((totalActual / totalPlanned) * 100) : 0;
  const doneCount = allInstances.filter((t) => t.done).length;
  const yieldColor = yieldPct >= 90 ? "#14A38A" : yieldPct >= 60 ? "#D9A441" : "#B0503A";

  const exportData = async () => {
    try {
      const bundle = { exportedAt: new Date().toISOString(), templates, days: {} };
      const dayPrefix = LS_PREFIX + "day:";
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith(dayPrefix)) {
          const dayKey = k.slice(LS_PREFIX.length);
          try { bundle.days[dayKey] = JSON.parse(localStorage.getItem(k)); } catch {}
        }
      }
      const blob = new Blob([JSON.stringify(bundle, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `cadence-sauvegarde-${todayKey()}.json`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    } catch {
      setError("Échec de l'export des données.");
    }
  };

  const importData = async (file) => {
    try {
      const text = await file.text();
      const bundle = JSON.parse(text);
      if (bundle.templates) {
        await offlineStorage.set("templates", JSON.stringify(bundle.templates));
        setTemplates(bundle.templates);
      }
      if (bundle.days) {
        for (const [dayKey, obj] of Object.entries(bundle.days)) {
          await offlineStorage.set(`day:${dayKey}`, JSON.stringify(obj));
        }
      }
      const res = await offlineStorage.get(`day:${dateKey}`);
      if (res && res.value) setDayData(JSON.parse(res.value));
      setError("");
    } catch {
      setError("Fichier de sauvegarde invalide.");
    }
  };

  const ready = templates && dayData && !loading;

  /* ---- navigation par glissement (swipe) entre les jours ---- */
  const touchRef = useRef({ x: 0, y: 0 });
  const onTouchStart = (e) => {
    const t = e.touches[0];
    touchRef.current = { x: t.clientX, y: t.clientY };
  };
  const onTouchEnd = (e) => {
    const t = e.changedTouches[0];
    const dx = t.clientX - touchRef.current.x;
    const dy = t.clientY - touchRef.current.y;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
      setDateKey(shiftDate(dateKey, dx < 0 ? 1 : -1));
    }
  };

  return (
    <div style={styles.page}>
      <div style={styles.container}>
        <div style={styles.headerRow}>
          <div style={styles.brand}>
            <span style={styles.brandMark}>◆</span>
            <span style={styles.brandText}>Cadence</span>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <StatusPill isOnline={isOnline} pendingCount={pendingCount} />
            {notifPermission !== "unsupported" && (
              <button
                style={styles.settingsBtn}
                onClick={async () => {
                  const granted = await requestNotifPermission();
                  setNotifPermission(granted ? "granted" : Notification.permission);
                }}
                aria-label="Activer les notifications"
                title={notifPermission === "granted" ? "Notifications activées" : "Activer les notifications"}
              >
                <Icon icon={notifPermission === "granted" ? Bell : BellOff} size={16} color={notifPermission === "granted" ? "#14A38A" : "#8A8676"} />
              </button>
            )}
            <button style={styles.settingsBtn} onClick={() => setManagerOpen(true)} aria-label="Gérer les catégories">
              <Icon icon={Settings2} size={17} color="#0B3D39" />
            </button>
          </div>
        </div>

        <div style={styles.viewTabs}>
          <button style={{ ...styles.viewTab, ...(view === "day" ? styles.viewTabActive : {}) }} onClick={() => setView("day")}>
            <Icon icon={ListChecks} size={14} color={view === "day" ? "#F7F6F1" : "#6B7268"} />
            Journée
          </button>
          <button style={{ ...styles.viewTab, ...(view === "dashboard" ? styles.viewTabActive : {}) }} onClick={() => setView("dashboard")}>
            <Icon icon={LayoutGrid} size={14} color={view === "dashboard" ? "#F7F6F1" : "#6B7268"} />
            Tableau de bord
          </button>
        </div>

        <div style={styles.dateNav} onTouchStart={onTouchStart} onTouchEnd={onTouchEnd}>
          <button style={styles.navBtn} onClick={() => setDateKey(shiftDate(dateKey, -1))} aria-label="Jour précédent">
            <Icon icon={ChevronLeft} size={18} color="#0B3D39" />
          </button>
          <div style={styles.dateBlock}>
            <div style={styles.dateLabel}>{fmtDateLabel(dateKey)}</div>
            {!isToday && <button style={styles.todayLink} onClick={() => setDateKey(todayKey())}>Revenir à aujourd'hui</button>}
          </div>
          <button style={styles.navBtn} onClick={() => setDateKey(shiftDate(dateKey, 1))} aria-label="Jour suivant">
            <Icon icon={ChevronRight} size={18} color="#0B3D39" />
          </button>
        </div>

        <div style={styles.summary}>
          <div style={styles.summaryItem}>
            <div style={{ ...styles.summaryNum, color: yieldColor }}>{allInstances.length ? `${yieldPct}%` : "—"}</div>
            <div style={styles.summaryLabel}>Rendement réel</div>
          </div>
          <div style={styles.summaryDivider} />
          <div style={styles.summaryItem}>
            <div style={styles.summaryNum}>{(totalActual / 60).toFixed(1)}<span style={styles.summaryUnit}> / {(totalPlanned / 60).toFixed(1)} h</span></div>
            <div style={styles.summaryLabel}>Temps réalisé</div>
          </div>
          <div style={styles.summaryDivider} />
          <div style={styles.summaryItem}>
            <div style={styles.summaryNum}>{doneCount}<span style={styles.summaryUnit}> / {allInstances.length}</span></div>
            <div style={styles.summaryLabel}>Tâches terminées</div>
          </div>
        </div>

        {error && (
          <div style={styles.errorBanner}>
            <Icon icon={WifiOff} size={13} color="#B0503A" style={{ marginLeft: 6, verticalAlign: "middle" }} /> {error}
          </div>
        )}

        {activeId && activeDateKey && activeDateKey !== dateKey && (
          <div style={styles.runningElsewhereBanner} onClick={() => setDateKey(activeDateKey)}>
            <Icon icon={Play} size={12} color="#14A38A" /> Chrono en cours sur {fmtDateLabel(activeDateKey)} — revenir
          </div>
        )}

        {!ready ? (
          <div style={styles.emptyState}>Chargement…</div>
        ) : view === "day" ? (
          <div style={styles.categoryList}>
            {templates.categories.map((cat) => (
              <CategoryBlock
                key={cat.id}
                category={cat}
                dayData={dayData}
                collapsed={!!collapsed[cat.id]}
                onToggle={() => toggleCollapse(cat.id)}
                activeId={activeDateKey === dateKey ? activeId : null}
                elapsedSec={elapsedSec}
                onUpdateInstance={updateInstance}
                onStart={startTimer}
                onPause={pauseAndCommit}
                onFinishPomo={finishPomo}
                onAddTask={(name) => addTaskToCategory(cat.id, name)}
              />
            ))}
          </div>
        ) : (
          <Dashboard
            templates={templates}
            dayData={dayData}
            dateLabel={fmtDateLabel(dateKey)}
            liveTaskId={activeDateKey === dateKey ? activeId : null}
            liveElapsedSec={elapsedSec}
          />
        )}
      </div>

      {activeId && activeDateKey === dateKey && !focusMode && (
        <button style={styles.focusFab} onClick={() => setFocusMode(true)} aria-label="Mode focus">
          <Icon icon={Target} size={18} color="#FFFFFF" />
        </button>
      )}

      {focusMode && activeId && (
        <FocusOverlay
          taskName={findTaskName(activeId)}
          elapsedSec={elapsedSec}
          mode={activeMode}
          onPause={() => { pauseAndCommit(activeId); setFocusMode(false); }}
          onFinishPomo={() => finishPomo(activeId)}
          onClose={() => setFocusMode(false)}
        />
      )}

      {managerOpen && templates && (
        <ManagerModal
          templates={templates}
          onClose={() => setManagerOpen(false)}
          onAddCategory={addCategory}
          onRemoveCategory={removeCategory}
          onAddTask={addTaskToCategory}
          onRemoveTask={removeTaskFromTemplate}
          onRenameTask={renameTemplateTask}
          onExport={exportData}
          onImport={importData}
        />
      )}
    </div>
  );
}

/* ============================================================
   FOCUS MODE — plein écran sur la tâche en cours, sans distraction
   ============================================================ */
function FocusOverlay({ taskName, elapsedSec, mode, onPause, onFinishPomo, onClose }) {
  const fmtTimer = (sec) => {
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60).toString().padStart(2, "0");
    const s = (sec % 60).toString().padStart(2, "0");
    return h > 0 ? `${h}:${m}:${s}` : `${m}:${s}`;
  };
  const cyclePos = mode === "pomodoro" ? elapsedSec % (POMODORO_MIN * 60) : elapsedSec;
  const cyclePct = mode === "pomodoro" ? Math.round((cyclePos / (POMODORO_MIN * 60)) * 100) : null;

  return (
    <div style={styles.focusOverlay}>
      <button style={styles.focusClose} onClick={onClose} aria-label="Quitter le mode focus">
        <Icon icon={X} size={20} color="#FFFFFF" />
      </button>
      <div style={styles.focusLabel}>En cours</div>
      <div style={styles.focusTaskName}>{taskName}</div>
      <div style={styles.focusTimer}>{fmtTimer(elapsedSec)}</div>
      {mode === "pomodoro" && (
        <div style={styles.focusCycleWrap}>
          <div style={styles.focusCycleTrack}>
            <div style={{ ...styles.focusCycleFill, width: `${cyclePct}%` }} />
          </div>
          <div style={styles.focusCycleLabel}>Cycle en cours — {cyclePct}%</div>
        </div>
      )}
      <div style={styles.focusActions}>
        <button style={styles.focusPauseBtn} onClick={onPause}>
          <Icon icon={Pause} size={16} color="#0B3D39" /> Mettre en pause
        </button>
        {mode === "pomodoro" && (
          <button style={styles.focusFinishBtn} onClick={onFinishPomo}>
            <Icon icon={RotateCcw} size={15} color="#F7F6F1" /> Terminer le cycle
          </button>
        )}
      </div>
    </div>
  );
}

/* ============================================================
   DASHBOARD — vue analytique du jour sélectionné
   ============================================================ */
function Dashboard({ templates, dayData, dateLabel, liveTaskId, liveElapsedSec }) {
  const liveMinutes = useCallback(
    (taskId) => (liveTaskId === taskId ? liveElapsedSec / 60 : 0),
    [liveTaskId, liveElapsedSec]
  );

  const catStats = useMemo(() => {
    return templates.categories.map((cat, idx) => {
      const instances = cat.tasks.map((t) => dayData[t.id]).filter(Boolean);
      const planned = instances.reduce((a, i) => a + plannedMinutes(i), 0);
      const actual = cat.tasks.reduce((a, t) => {
        const inst = dayData[t.id];
        if (!inst) return a;
        return a + actualMinutes(inst) + liveMinutes(t.id);
      }, 0);
      const done = instances.filter((i) => i.done).length;
      return { id: cat.id, name: cat.name, planned, actual, done, total: instances.length, color: catColor(idx) };
    }).filter((c) => c.total > 0);
  }, [templates, dayData, liveMinutes]);

  const allInstances = Object.values(dayData);
  const allEntries = Object.entries(dayData);
  const totalPlanned = allInstances.reduce((a, t) => a + plannedMinutes(t), 0);
  const totalActual = allEntries.reduce((a, [id, t]) => a + actualMinutes(t) + liveMinutes(id), 0);
  const yieldPct = totalPlanned > 0 ? Math.round((totalActual / totalPlanned) * 100) : 0;
  const doneCount = allInstances.filter((t) => t.done).length;
  const overrunCount = allEntries.filter(([id, t]) => {
    const actual = actualMinutes(t) + liveMinutes(id);
    const planned = plannedMinutes(t);
    return actual > planned && planned > 0;
  }).length;
  const maxMinutes = Math.max(1, ...catStats.map((c) => Math.max(c.planned, c.actual)));

  const STREAK_THRESHOLD = 70;
  const HISTORY_DAYS = 30;
  const [historyRange, setHistoryRange] = useState("week");
  const [history, setHistory] = useState(null); // [{dateKey, yieldPct, raw}] oldest -> newest, length 30
  const [historyLoading, setHistoryLoading] = useState(true);

  useEffect(() => {
    let cancelled = false;
    setHistoryLoading(true);
    (async () => {
      const keys = [];
      for (let i = HISTORY_DAYS - 1; i >= 0; i--) keys.push(shiftDate(todayKey(), -i));
      const results = await Promise.all(
        keys.map(async (k) => {
          const raw = await fetchDayRaw(k);
          const stats = dayYieldFromRaw(raw);
          return { dateKey: k, yieldPct: stats ? stats.yieldPct : null, raw };
        })
      );
      if (!cancelled) { setHistory(results); setHistoryLoading(false); }
    })();
    return () => { cancelled = true; };
  }, []);

  const streak = useMemo(() => {
    if (!history) return 0;
    let count = 0;
    for (let i = history.length - 1; i >= 0; i--) {
      const h = history[i];
      if (h.yieldPct !== null && h.yieldPct >= STREAK_THRESHOLD) count++;
      else break;
    }
    return count;
  }, [history]);

  const suggestion = useMemo(() => {
    if (!history) return null;
    for (const cat of templates.categories) {
      if (cat.tasks.length === 0) continue;
      const taskIds = cat.tasks.map((t) => t.id);
      let lastActiveIdx = -1;
      for (let i = history.length - 1; i >= 0; i--) {
        const raw = history[i].raw;
        if (!raw) continue;
        const hasActivity = taskIds.some((id) => raw[id] && actualMinutes(raw[id]) > 0);
        if (hasActivity) { lastActiveIdx = i; break; }
      }
      const gap = lastActiveIdx === -1 ? history.length : (history.length - 1 - lastActiveIdx);
      if (gap >= 3) {
        return { category: cat.name, days: lastActiveIdx === -1 ? `${HISTORY_DAYS}+` : gap };
      }
    }
    return null;
  }, [history, templates]);

  const displayedHistory = history ? (historyRange === "week" ? history.slice(-7) : history) : [];

  const totalActiveTime = catStats.reduce((a, c) => a + c.actual, 0);
  let cumulative = 0;
  const donutStops = catStats
    .filter((c) => c.actual > 0)
    .map((c) => {
      const start = (cumulative / (totalActiveTime || 1)) * 360;
      cumulative += c.actual;
      const end = (cumulative / (totalActiveTime || 1)) * 360;
      return `${c.color} ${start}deg ${end}deg`;
    });
  const donutBg = donutStops.length > 0 ? `conic-gradient(${donutStops.join(", ")})` : "#EFEDE4";

  return (
    <div>
      <div style={styles.dashSubtitle}>Détail complet — {dateLabel}</div>

      {!historyLoading && streak > 0 && (
        <div style={styles.streakCard}>
          <div style={styles.streakIconWrap}>
            <Icon icon={Flame} size={22} color="#D9A441" />
          </div>
          <div>
            <div style={styles.streakNum}>{streak} jour{streak > 1 ? "s" : ""} d'affilée</div>
            <div style={styles.streakLabel}>Rendement ≥ {STREAK_THRESHOLD}% — continue comme ça</div>
          </div>
        </div>
      )}

      {!historyLoading && suggestion && (
        <div style={styles.suggestionCard}>
          <Icon icon={AlertTriangle} size={15} color="#D9A441" style={{ marginTop: 1, minWidth: 15 }} />
          <div>
            <strong>{suggestion.category}</strong> n'a pas été touchée depuis {suggestion.days} jour{suggestion.days !== 1 ? "s" : ""}. Un petit créneau aujourd'hui ?
          </div>
        </div>
      )}

      <div style={styles.kpiGrid}>
        <div style={styles.kpiCard}>
          <Icon icon={TrendingUp} size={16} color="#14A38A" />
          <div style={styles.kpiNum}>{allInstances.length ? `${yieldPct}%` : "—"}</div>
          <div style={styles.kpiLabel}>Rendement</div>
        </div>
        <div style={styles.kpiCard}>
          <Icon icon={ListChecks} size={16} color="#0B3D39" />
          <div style={styles.kpiNum}>{doneCount}/{allInstances.length}</div>
          <div style={styles.kpiLabel}>Terminées</div>
        </div>
        <div style={styles.kpiCard}>
          <Icon icon={AlertTriangle} size={16} color="#B0503A" />
          <div style={styles.kpiNum}>{overrunCount}</div>
          <div style={styles.kpiLabel}>Dépassements</div>
        </div>
        <div style={styles.kpiCard}>
          <span style={{ fontFamily: "'Poppins', sans-serif", fontWeight: 700, fontSize: 14, color: "#D9A441" }}>Σ</span>
          <div style={styles.kpiNum}>{(totalActual / 60).toFixed(1)}h</div>
          <div style={styles.kpiLabel}>Temps total</div>
        </div>
      </div>

      {catStats.length === 0 ? (
        <div style={styles.emptyState}>Aucune tâche configurée pour l'instant.</div>
      ) : (
        <>
          <div style={styles.chartCard}>
            <div style={styles.chartTitle}>Évolution du rendement</div>
            <div style={styles.rangeToggle}>
              <button style={{ ...styles.rangeBtn, ...(historyRange === "week" ? styles.rangeBtnActive : {}) }} onClick={() => setHistoryRange("week")}>7 jours</button>
              <button style={{ ...styles.rangeBtn, ...(historyRange === "month" ? styles.rangeBtnActive : {}) }} onClick={() => setHistoryRange("month")}>30 jours</button>
            </div>
            {historyLoading ? (
              <div style={{ fontSize: 12, color: "#A5A196", padding: "10px 0" }}>Chargement de l'historique…</div>
            ) : (
              <div style={styles.historyChartWrap}>
                {displayedHistory.map((h) => {
                  const pct = h.yieldPct === null ? 0 : Math.max(4, h.yieldPct);
                  const color = h.yieldPct === null ? "#E4E1D6" : h.yieldPct >= 90 ? "#14A38A" : h.yieldPct >= 60 ? "#D9A441" : "#B0503A";
                  return (
                    <div key={h.dateKey} style={styles.historyBarCol}>
                      <div style={styles.historyBarTrack}>
                        <div style={{ ...styles.historyBarFill, height: `${Math.min(100, pct)}%`, background: color }} />
                      </div>
                      <div style={styles.historyBarLabel}>{shortDayLabel(h.dateKey)}</div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>

          <div style={styles.chartCard}>
            <div style={styles.chartTitle}>Répartition du temps réalisé</div>
            <div style={styles.donutRow}>
              <div style={styles.donutWrap}>
                <div style={{ ...styles.donutRing, background: donutBg }} />
                <div style={styles.donutHole}>
                  <div style={styles.donutHoleNum}>{(totalActiveTime / 60).toFixed(1)}h</div>
                  <div style={styles.donutHoleLabel}>réalisé</div>
                </div>
              </div>
              <div style={styles.legend}>
                {catStats.filter((c) => c.actual > 0).map((c) => (
                  <div key={c.id} style={styles.legendRow}>
                    <span style={{ ...styles.legendDot, background: c.color }} />
                    <span style={styles.legendName}>{c.name}</span>
                    <span style={styles.legendVal}>{(c.actual / 60).toFixed(1)}h</span>
                  </div>
                ))}
                {catStats.every((c) => c.actual === 0) && (
                  <div style={{ fontSize: 12, color: "#A5A196" }}>Aucun temps enregistré encore aujourd'hui.</div>
                )}
              </div>
            </div>
          </div>

          <div style={styles.chartCard}>
            <div style={styles.chartTitle}>Prévu vs réalisé par catégorie</div>
            <div style={styles.barChartLegendRow}>
              <span style={styles.barLegendItem}><span style={{ ...styles.barLegendSwatch, background: "#E4E1D6" }} /> Prévu</span>
              <span style={styles.barLegendItem}><span style={{ ...styles.barLegendSwatch, background: "#0B3D39" }} /> Réalisé</span>
            </div>
            <div style={styles.barList}>
              {catStats.map((c) => (
                <div key={c.id} style={styles.barRow}>
                  <div style={styles.barRowLabel}>{c.name}</div>
                  <div style={styles.barTrackWrap}>
                    <div style={styles.barTrackBg}>
                      <div style={{ ...styles.barTrackFill, width: `${(c.planned / maxMinutes) * 100}%`, background: "#E4E1D6" }} />
                    </div>
                    <div style={styles.barTrackBg}>
                      <div style={{ ...styles.barTrackFill, width: `${(c.actual / maxMinutes) * 100}%`, background: c.actual > c.planned && c.planned > 0 ? "#B0503A" : "#0B3D39" }} />
                    </div>
                  </div>
                  <div style={styles.barRowVal}>{(c.actual / 60).toFixed(1)} / {(c.planned / 60).toFixed(1)} h</div>
                </div>
              ))}
            </div>
          </div>

          <div style={styles.chartCard}>
            <div style={styles.chartTitle}>Détail des tâches</div>
            <div style={styles.taskTable}>
              {templates.categories.map((cat) =>
                cat.tasks.map((t) => {
                  const inst = dayData[t.id];
                  if (!inst) return null;
                  const isLive = liveTaskId === t.id;
                  const planned = plannedMinutes(inst);
                  const actual = actualMinutes(inst) + liveMinutes(t.id);
                  const over = actual > planned && planned > 0;
                  const statusLabel = inst.done ? "Terminée" : isLive ? "En direct" : actual > 0 ? "En cours" : "Non commencée";
                  const statusColor = inst.done ? "#14A38A" : isLive ? "#14A38A" : actual > 0 ? "#D9A441" : "#A5A196";
                  return (
                    <div key={t.id} style={{ ...styles.taskTableRow, background: isLive ? "#F1FAF6" : "transparent" }}>
                      <div style={styles.taskTableMain}>
                        <div style={styles.taskTableName}>{t.name}</div>
                        <div style={styles.taskTableCat}>{cat.name}</div>
                      </div>
                      <div style={styles.taskTableTime}>
                        {inst.mode === "hours" ? `${(actual / 60).toFixed(2)}/${inst.plannedHours}h` : `${(actual / POMODORO_MIN).toFixed(2)}/${inst.plannedPomos} cy.`}
                        {over && <span style={{ color: "#B0503A" }}> ⚠</span>}
                      </div>
                      <div style={{ ...styles.taskTableStatus, color: statusColor, borderColor: statusColor }}>{statusLabel}</div>
                    </div>
                  );
                })
              )}
            </div>
          </div>
        </>
      )}
    </div>
  );
}

/* ============================================================
   CATEGORY BLOCK
   ============================================================ */
function CategoryBlock({ category, dayData, collapsed, onToggle, activeId, elapsedSec, onUpdateInstance, onStart, onPause, onFinishPomo, onAddTask }) {
  const [addingName, setAddingName] = useState("");
  const [showAdd, setShowAdd] = useState(false);

  const instances = category.tasks.map((t) => dayData[t.id]).filter(Boolean);
  const planned = instances.reduce((a, i) => a + plannedMinutes(i), 0);
  const actual = instances.reduce((a, i) => a + actualMinutes(i) + (activeId === i.id ? elapsedSec / 60 : 0), 0);
  const pct = planned > 0 ? Math.min(100, Math.round((actual / planned) * 100)) : 0;
  const doneCount = instances.filter((i) => i.done).length;

  const submitAdd = () => { if (addingName.trim()) { onAddTask(addingName.trim()); setAddingName(""); setShowAdd(false); } };

  return (
    <div style={styles.catBlock}>
      <button style={styles.catHeader} onClick={onToggle}>
        <Icon icon={ChevronDown} size={16} color="#8A8676" style={{ transform: collapsed ? "rotate(-90deg)" : "rotate(0deg)", transition: "transform 0.2s ease" }} />
        <div style={styles.catHeaderText}>
          <div style={styles.catName}>{category.name}</div>
          {category.sub && <div style={styles.catSub}>{category.sub}</div>}
        </div>
        {instances.length > 0 && (
          <div style={styles.catMeta}>
            <span style={styles.catMetaCount}>{doneCount}/{instances.length}</span>
            <div style={styles.catMiniTrack}><div style={{ ...styles.catMiniFill, width: `${pct}%` }} /></div>
          </div>
        )}
      </button>

      {!collapsed && (
        <div style={styles.catBody}>
          {category.tasks.map((t) => {
            const inst = dayData[t.id];
            if (!inst) return null;
            return (
              <TaskRow
                key={t.id} name={t.name} inst={inst}
                isActive={activeId === t.id}
                elapsedSec={activeId === t.id ? elapsedSec : 0}
                otherActive={!!activeId && activeId !== t.id}
                onUpdate={(patch) => onUpdateInstance(t.id, patch)}
                onStart={() => onStart(t.id)}
                onPause={() => onPause(t.id)}
                onFinishPomo={() => onFinishPomo(t.id)}
              />
            );
          })}

          {category.tasks.length === 0 && !showAdd && <div style={styles.catEmptyHint}>Aucune sous-tâche pour l'instant.</div>}

          {showAdd ? (
            <div style={styles.inlineAddRow}>
              <input autoFocus style={styles.inlineAddInput} placeholder="Nom de la sous-tâche…"
                value={addingName} onChange={(e) => setAddingName(e.target.value)}
                onKeyDown={(e) => { if (e.key === "Enter") submitAdd(); if (e.key === "Escape") setShowAdd(false); }} />
              <button style={styles.inlineAddConfirm} onClick={submitAdd}>Ajouter</button>
              <button style={styles.inlineAddCancel} onClick={() => setShowAdd(false)}><Icon icon={X} size={14} color="#8A8676" /></button>
            </div>
          ) : (
            <button style={styles.addSubtaskBtn} onClick={() => setShowAdd(true)}><Icon icon={Plus} size={13} color="#14A38A" /> Ajouter une sous-tâche</button>
          )}
          <div style={styles.propagateNote}>Ajoutée ici, elle apparaîtra pour tous les jours suivants.</div>
        </div>
      )}
    </div>
  );
}

/* ============================================================
   TASK ROW
   ============================================================ */
function TaskRow({ name, inst, isActive, elapsedSec, otherActive, onUpdate, onStart, onPause, onFinishPomo }) {
  const planned = plannedMinutes(inst);
  const actual = actualMinutes(inst) + (isActive ? elapsedSec / 60 : 0);
  const pct = planned > 0 ? Math.min(100, Math.round((actual / planned) * 100)) : 0;
  const over = actual > planned && planned > 0;
  const barColor = over ? "#B0503A" : pct >= 90 ? "#14A38A" : "#D9A441";

  const fmtTimer = (sec) => {
    const m = Math.floor(sec / 60).toString().padStart(2, "0");
    const s = (sec % 60).toString().padStart(2, "0");
    return `${m}:${s}`;
  };

  return (
    <div style={{ ...styles.taskRow, opacity: inst.done ? 0.55 : 1 }}>
      <div style={styles.taskTop}>
        <button style={{ ...styles.checkBtn, background: inst.done ? "#14A38A" : "transparent", borderColor: inst.done ? "#14A38A" : "#D5D1C4" }}
          onClick={() => onUpdate({ done: !inst.done })} aria-label="Marquer comme terminée">
          {inst.done && <Icon icon={Check} size={12} color="#FFFFFF" strokeWidth={3} />}
        </button>
        <span style={{ ...styles.taskName, textDecoration: inst.done ? "line-through" : "none" }}>{name}</span>
      </div>

      <div style={styles.taskControls}>
        <div style={styles.modeSwitch}>
          <button style={{ ...styles.modeBtn, ...(inst.mode === "hours" ? styles.modeBtnActive : {}) }} onClick={() => onUpdate({ mode: "hours" })}>Heures</button>
          <button style={{ ...styles.modeBtn, ...(inst.mode === "pomodoro" ? styles.modeBtnActive : {}) }} onClick={() => onUpdate({ mode: "pomodoro" })}>Cycles</button>
        </div>

        {inst.mode === "hours" ? (
          <div style={styles.numStepper}>
            <button style={styles.stepBtn} onClick={() => onUpdate({ plannedHours: Math.max(0.5, inst.plannedHours - 0.5) })}>−</button>
            <span style={styles.stepVal}>{inst.plannedHours} h</span>
            <button style={styles.stepBtn} onClick={() => onUpdate({ plannedHours: inst.plannedHours + 0.5 })}>+</button>
          </div>
        ) : (
          <div style={styles.numStepper}>
            <button style={styles.stepBtn} onClick={() => onUpdate({ plannedPomos: Math.max(1, inst.plannedPomos - 1) })}>−</button>
            <span style={styles.stepVal}>{inst.plannedPomos} cy.</span>
            <button style={styles.stepBtn} onClick={() => onUpdate({ plannedPomos: inst.plannedPomos + 1 })}>+</button>
          </div>
        )}

        <div style={styles.timerZone}>
          {isActive ? (
            <>
              <span style={styles.timerText}>{fmtTimer(elapsedSec)}</span>
              <button style={styles.iconBtnAccent} onClick={onPause} aria-label="Mettre en pause"><Icon icon={Pause} size={13} color="#FFFFFF" /></button>
              {inst.mode === "pomodoro" && (
                <button style={styles.iconBtnOutline} onClick={onFinishPomo} aria-label="Valider un cycle"><Icon icon={RotateCcw} size={12} color="#14A38A" /></button>
              )}
            </>
          ) : (
            <button style={{ ...styles.iconBtnAccent, opacity: otherActive ? 0.3 : 1 }} onClick={onStart} disabled={otherActive} aria-label="Démarrer">
              <Icon icon={Play} size={13} color="#FFFFFF" />
            </button>
          )}
        </div>
      </div>

      <div style={styles.progressTrack}><div style={{ ...styles.progressFill, width: `${pct}%`, background: barColor }} /></div>
      <div style={styles.progressLabel}>
        {inst.mode === "hours" ? `${(actual / 60).toFixed(1)} / ${inst.plannedHours} h` : `${(actual / POMODORO_MIN).toFixed(1)} / ${inst.plannedPomos} cycles`}
        {over && <span style={{ color: "#B0503A" }}> · dépassement</span>}
      </div>
    </div>
  );
}

/* ============================================================
   MANAGER MODAL
   ============================================================ */
function ManagerModal({ templates, onClose, onAddCategory, onRemoveCategory, onAddTask, onRemoveTask, onRenameTask, onExport, onImport }) {
  const [newCatName, setNewCatName] = useState("");
  const [addingTo, setAddingTo] = useState(null);
  const [newTaskName, setNewTaskName] = useState("");
  const fileInputRef = useRef(null);

  return (
    <div style={styles.modalOverlay} onClick={onClose}>
      <div style={styles.modalPanel} onClick={(e) => e.stopPropagation()}>
        <div style={styles.modalHeader}>
          <span style={styles.modalTitle}>Gérer les catégories & tâches</span>
          <button style={styles.modalClose} onClick={onClose}><Icon icon={X} size={18} color="#6B7268" /></button>
        </div>
        <div style={styles.modalSubtext}>Toute modification ici s'applique à tous les jours à venir. Les jours passés restent inchangés.</div>

        <div style={styles.dataActionsRow}>
          <button style={styles.dataActionBtn} onClick={onExport}>
            <Icon icon={Download} size={14} color="#0B3D39" /> Exporter mes données
          </button>
          <button style={styles.dataActionBtn} onClick={() => fileInputRef.current && fileInputRef.current.click()}>
            <Icon icon={Upload} size={14} color="#0B3D39" /> Importer
          </button>
          <input
            ref={fileInputRef}
            type="file"
            accept="application/json"
            style={{ display: "none" }}
            onChange={(e) => {
              const file = e.target.files && e.target.files[0];
              if (file) onImport(file);
              e.target.value = "";
            }}
          />
        </div>

        <div style={styles.modalBody}>
          {templates.categories.map((cat) => (
            <div key={cat.id} style={styles.modalCatCard}>
              <div style={styles.modalCatHeader}>
                <span style={styles.modalCatName}>{cat.name}</span>
                <button style={styles.modalDeleteCat} onClick={() => onRemoveCategory(cat.id)} aria-label="Supprimer la catégorie">
                  <Icon icon={Trash2} size={14} color="#8A8676" />
                </button>
              </div>
              <div style={styles.modalTaskList}>
                {cat.tasks.map((t) => (
                  <div key={t.id} style={styles.modalTaskRow}>
                    <Icon icon={GripVertical} size={13} color="#C7C3B6" />
                    <input style={styles.modalTaskInput} value={t.name} onChange={(e) => onRenameTask(cat.id, t.id, e.target.value)} />
                    <button style={styles.modalTaskDelete} onClick={() => onRemoveTask(cat.id, t.id)} aria-label="Supprimer">
                      <Icon icon={Trash2} size={13} color="#A5A196" />
                    </button>
                  </div>
                ))}
              </div>

              {addingTo === cat.id ? (
                <div style={styles.inlineAddRow}>
                  <input autoFocus style={styles.inlineAddInput} placeholder="Nouvelle sous-tâche…" value={newTaskName}
                    onChange={(e) => setNewTaskName(e.target.value)}
                    onKeyDown={(e) => {
                      if (e.key === "Enter" && newTaskName.trim()) { onAddTask(cat.id, newTaskName.trim()); setNewTaskName(""); setAddingTo(null); }
                      if (e.key === "Escape") setAddingTo(null);
                    }} />
                  <button style={styles.inlineAddConfirm} onClick={() => { if (newTaskName.trim()) { onAddTask(cat.id, newTaskName.trim()); setNewTaskName(""); setAddingTo(null); } }}>Ajouter</button>
                </div>
              ) : (
                <button style={styles.addSubtaskBtn} onClick={() => setAddingTo(cat.id)}><Icon icon={Plus} size={13} color="#14A38A" /> Ajouter une sous-tâche</button>
              )}
            </div>
          ))}

          <div style={styles.modalNewCatRow}>
            <input style={styles.modalNewCatInput} placeholder="Nom d'une nouvelle catégorie (ex : Lecture)" value={newCatName}
              onChange={(e) => setNewCatName(e.target.value)}
              onKeyDown={(e) => { if (e.key === "Enter" && newCatName.trim()) { onAddCategory(newCatName.trim()); setNewCatName(""); } }} />
            <button style={styles.modalNewCatBtn} onClick={() => { if (newCatName.trim()) { onAddCategory(newCatName.trim()); setNewCatName(""); } }}>
              <Icon icon={Plus} size={16} color="#FFFFFF" />
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}
